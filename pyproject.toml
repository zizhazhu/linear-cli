[project]
name = "linear-cli"
version = "0.1.0"
description = "A command-line tool for Linear"
readme = "README.md"
authors = [
    { name = "Li-ionFractalNanocore", email = "liionfractalnanocore@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.2",
    "rich>=15.0.0",
    "toon-format==0.9.0b1",
    "typer>=0.27.0",
]

[project.scripts]
linear = "linear_cli.app:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
